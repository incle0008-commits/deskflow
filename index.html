  /* ================= 未完了一覧（＋完了履歴・検索） ================= */
  function viewList() {
    const td = today(); const open = tasks().filter((t) => t.status !== 'done');
    const tabs = { open: `未完了 <span class="n">${open.length}</span>`, done: '完了履歴', search: '検索' };
    const tabBar = `<div class="tabs" role="tablist">${Object.entries(tabs).map(([k, l]) => `<button type="button" role="tab" aria-selected="${ui.listTab === k}" class="${ui.listTab === k ? 'on' : ''}" data-listtab="${k}">${l}</button>`).join('')}</div>`;
    if (ui.listTab !== 'open') return tabBar + searchUi();
    const groups = { all: open, overdue: open.filter((t) => C.isOverdue(t, td)), due: open.filter((t) => t.executionDate <= td), future: open.filter((t) => t.executionDate > td) };
    const list = groups[ui.pendingFilter].sort((a, b) => C.refDate(a).localeCompare(C.refDate(b)) || PRI_ORDER[a.priority] - PRI_ORDER[b.priority]);
    const labels = { all: 'すべて', overdue: '期限切れ', due: '今日まで', future: 'これから' };
    return `${tabBar}<div class="toolbar"><div class="seg">${Object.keys(labels).map((k) => `<button type="button" class="${ui.pendingFilter === k ? 'on' : ''}" data-pf="${k}">${labels[k]}<span class="n">${groups[k].length}</span></button>`).join('')}</div></div>
      <p class="hint" style="margin:-4px 0 12px">未完了のタスクは、登録した月に関係なく完了するまでここに表示され続けます。</p>
      <div class="card">${list.length ? list.map((t) => {
        const d = C.delayDays(t, td);
        return `<div class="pcard" data-task="${esc(t.id)}"><div>
          <div class="ptitle">${t.priority === 'high' ? '<i class="hi-mark">!</i>' : ''}${esc(t.title)} ${priBadge(t.priority)} ${catChip(t.categoryId)} ${d > 0 ? `<span class="late">${d}日遅れ</span>` : C.refDate(t) === td ? '<span class="late late-soft">今日期限</span>' : ''}</div>
          <dl class="pfields"><div><dt>元の予定日</dt><dd>${fmtSmart(t.scheduledDate || t.executionDate)}</dd></div>
            <div><dt>実行日</dt><dd class="${t.scheduledDate && t.scheduledDate !== t.executionDate ? 'shiftd' : ''}">${fmtSmart(t.executionDate)}</dd></div>
            <div><dt>期限</dt><dd class="${d > 0 ? 'red' : ''}">${t.dueDate ? fmtSmart(t.dueDate) : '—'}</dd></div></dl>
          ${t.memo ? `<div class="tmemo">${esc(t.memo)}</div>` : ''}</div>
          <button type="button" class="btn btn-primary btn-lg done-btn" data-complete="${esc(t.id)}">${ic('check')}完了</button></div>`;
      }).join('') : emptyBox(ui.pendingFilter === 'all' ? '未完了のタスクはありません。お疲れさまでした！' : '該当するタスクはありません', 'check')}</div>`;
  }
  function filteredTasks() {
    const td = today(); const q = ui.q.trim().toLowerCase(); const mk = C.monthKey(td);
    const p = C.parse(td); const prev = C.addMonths(p.y, p.m, -1), next = C.addMonths(p.y, p.m, 1);
    const pm = `${prev.y}-${C.pad(prev.m)}`, nm = `${next.y}-${C.pad(next.m)}`;
    const status = ui.listTab === 'done' ? 'done' : ui.fStatus;
    const arr = tasks().filter((t) => {
      if (status === 'open' && t.status === 'done') return false;
      if (status === 'done' && t.status !== 'done') return false;
      if (status === 'overdue' && !C.isOverdue(t, td)) return false;
      if (ui.fCat && t.categoryId !== ui.fCat) return false;
      if (ui.fPri && t.priority !== ui.fPri) return false;
      if (ui.fKind === 'tpl' && !t.templateId) return false;
      if (ui.fKind === 'single' && t.templateId) return false;
      const em = C.monthKey(t.executionDate);
      if (ui.fPeriod === 'this' && em !== mk) return false;
      if (ui.fPeriod === 'prev' && em !== pm) return false;
      if (ui.fPeriod === 'next' && em !== nm) return false;
      if (ui.fPeriod === 'year' && t.executionDate.slice(0, 4) !== td.slice(0, 4)) return false;
      if (q && !(`${t.title} ${t.memo} ${catOf(t.categoryId).name}`.toLowerCase().includes(q))) return false;
      return true;
    });
    const s = ui.listTab === 'done' && ui.sort === 'date-asc' ? 'done-desc' : ui.sort;
    arr.sort((a, b) => s === 'date-desc' ? b.executionDate.localeCompare(a.executionDate) : s === 'done-desc' ? (b.completedAt || 0) - (a.completedAt || 0) : s === 'pri' ? PRI_ORDER[a.priority] - PRI_ORDER[b.priority] || a.executionDate.localeCompare(b.executionDate) : a.executionDate.localeCompare(b.executionDate));
    return arr;
  }
  function searchUi() {
    const opt = (v, l, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`;
    const done = ui.listTab === 'done';
    return `<div class="card section"><div class="card-b">
      <div class="search" style="margin-bottom:10px">${ic('search')}<input class="input" id="q" type="search" placeholder="タスク名・メモ・カテゴリーで検索" value="${esc(ui.q)}"></div>

        <select class="input" data-f="fCat" aria-label="カテゴリー">${opt('', 'すべてのカテゴリー', ui.fCat)}${cats().map((c) => opt(c.id, c.name, ui.fCat)).join('')}</select>
        <select class="input" data-f="fPeriod" aria-label="期間">${opt('all', 'すべての期間', ui.fPeriod)}${opt('this', '今月', ui.fPeriod)}${opt('prev', '先月', ui.fPeriod)}${opt('next', '来月', ui.fPeriod)}${opt('year', '今年', ui.fPeriod)}</select>
        <select class="input" data-f="fPri" aria-label="優先度">${opt('', 'すべての優先度', ui.fPri)}${opt('high', '優先度：高', ui.fPri)}${opt('mid', '優先度：中', ui.fPri)}${opt('low', '優先度：低', ui.fPri)}</select>
        <select class="input" data-f="fKind" aria-label="種別">${opt('', '繰り返し・単発', ui.fKind)}${opt('tpl', '繰り返しのみ', ui.fKind)}${opt('single', '単発のみ', ui.fKind)}</select>

  function resultsHtml() {

  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open-task], [data-day]') && !UI.modalOpen()) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target; if (t.closest('#sticky-layer')) return;
    if (t.id === 'q') { ui.q = t.value; const r = $('#task-results'); if (r) r.innerHTML = resultsHtml(); }
    if (t.dataset.memoText) Sticky.saveMemoText(t.dataset.memoText, t.value);
    if ('psOpacity' in t.dataset) { const b = t.parentElement.querySelector('b'); if (b) b.textContent = t.value + '%'; const p = $('#st-panel'); if (p) p.style.setProperty('--st-op', Number(t.value) / 100); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target; if (t.closest('#sticky-layer') || t.closest('.overlay')) return;
    if (t.dataset.f) { ui[t.dataset.f] = t.value; const r = $('#task-results'); if (r) r.innerHTML = resultsHtml(); return; }
    if (t.dataset.catName) { const name = t.value.trim(); if (!name) { render(); return; } commit(null, (s) => { s.categories[t.dataset.catName] = { ...s.categories[t.dataset.catName], name, updatedAt: Date.now() }; }); return; }
    if (t.dataset.catColor) { commit(null, (s) => { s.categories[t.dataset.catColor] = { ...s.categories[t.dataset.catColor], color: t.value, updatedAt: Date.now() }; }); return; }
    if (t.id === 'close-ye') { commit('休業日の設定を変更しました', (s) => { s.settings = { ...s.settings, closeYearEnd: t.checked, updatedAt: Date.now() }; }); return; }
    if (t.id === 'restore-file' && t.files && t.files[0]) { const fr = new FileReader(); fr.onload = () => restoreFrom(String(fr.result)); fr.readAsText(t.files[0]); t.value = ''; return; }
    if ('psOpacity' in t.dataset) { Sticky.setPanel({ opacity: Number(t.value) / 100 }, 'data'); return; }
    if (t.dataset.psOpt) { Sticky.setPanel({ [t.dataset.psOpt]: t.checked }, 'data'); return; }
    if ('psMode' in t.dataset) { Sticky.setPanel({ mode: t.value, ...(t.value === 'date' && !S().panel.selDate ? { selDate: today() } : {}) }, 'data'); }
  });
  document.addEventListener('focusout', (e) => { const t = e.target; if (t.dataset && t.dataset.memoText && !t.closest('#sticky-layer')) { const m = S().memos[t.dataset.memoText]; if (m && m.text !== t.value) commit(null, (s) => { s.memos[m.id] = { ...m, text: t.value, updatedAt: Date.now() }; }, { undo: false, reason: 'memo' }); } });

  /* ================= 起動 ================= */
  function dailyCheck() {
    const td = today(); const made = C.generate(S(), td).length;
    if (made) Store.persist();
    if (td !== lastToday || made) { lastToday = td; if (!UI.modalOpen()) { render(); Sticky.render('data'); } }
  }
  function start() {
    const info = Store.init();
    $('#fab').addEventListener('click', () => openEditorFor());
    $('#top-add').addEventListener('click', () => openEditorFor());
    $('#top-sticky').addEventListener('click', () => Sticky.setPanel({ visible: !S().panel.visible }, 'data'));
    window.addEventListener('hashchange', () => { UI.closeModal(true); window.scrollTo(0, 0); render(); });
    Store.subscribe(onStoreChange);
    Sync.listeners.add(renderSync);
    render(); Sticky.init();
    if (!Local.ok) UI.setSaveError(true);
    if (info.migrated) console.info('データを新しい形式に移行しました（既存データは維持）');
    document.addEventListener('visibilitychange', () => { if (!document.hidden) dailyCheck(); });
    setInterval(dailyCheck, 60 * 1000);
    let lastDesk = UI.isDesktop(); window.addEventListener('resize', () => { if (UI.isDesktop() !== lastDesk) { lastDesk = UI.isDesktop(); if (route() === 'calendar') render(); } });
    // クラウド同期：Claude 上で開いたときのみ。GitHub Pages では端末保存のみ（README参照）
    if (window.SupabaseRemote) Sync.start(window.SupabaseRemote); // docs/supabase-adapter.example.js を組み込んだ場合
    else if (window.claude && typeof window.claude.use === 'function') Sync.start(Storage.ClaudeRemote);
    // PWA：Service Worker（HTTPS または localhost のときのみ）
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && window.top === window.self) {
      Promise.reject(new Error('single-file')).catch((e) => console.info('SW not registered', e && e.message));
    }
  }
  return { start, openTask: (id) => editor({ taskId: id }), toggleTask, quickAdd, editor, render, ui };
})();
window.App = App;
document.addEventListener('DOMContentLoaded', () => App.start());

</script>
</body>
