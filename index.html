<style>
:root{
  --navy:#16325c; --navy-2:#24497f; --blue:#2f8fdc; --sky:#e9f4fd; --sky-2:#d4eafb;
  --bg:#f5f8fc; --card:#fff; --line:#e3e9f1; --line-2:#eef2f7;
  --text:#1b2738; --sub:#5c6b80; --muted:#8a97a8;
  --red:#d6455d; --red-bg:#fdecef; --orange:#d9822b; --orange-bg:#fdf3e7; --green:#1f9d6b; --green-bg:#e6f6ef;
  --sat:#2f7fd0; --sun:#d6455d;
  --r:12px; --shadow:0 1px 2px rgba(22,50,92,.06),0 2px 8px rgba(22,50,92,.05);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- レイアウト ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:232px;flex:0 0 232px;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:700;font-size:16px;letter-spacing:.02em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5bb4f3,#2f8fdc);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.65;letter-spacing:0}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#c9d7ea;text-decoration:none;font-size:14.5px}
.side-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav a.active{background:rgba(91,180,243,.18);color:#fff;font-weight:600}
.side-nav svg{width:19px;height:19px;flex:0 0 19px}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:10px 12px;font-size:12px;color:#9fb3cf}
.sync-pill{display:inline-flex;align-items:center;gap:6px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#9fb3cf}
.sync-dot.ok{background:#4cd39b}.sync-dot.busy{background:#f4c04e}.sync-dot.err{background:#ff7a8d}

.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,248,252,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 28px;padding-top:calc(14px + var(--safe-t))}
.topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--navy)}
.topbar .date{color:var(--sub);font-size:13px}
.topbar .spacer{flex:1}
.topbar .mobile-only{display:none}
main{padding:24px 28px 60px;max-width:1180px;width:100%}
body[data-route=calendar] main{max-width:1500px}

.bottom-nav{display:none}
.fab{display:none}

@media (max-width:899px){
  .sidebar{display:none}
  .topbar{padding:12px 16px;padding-top:calc(12px + var(--safe-t))}
  .topbar h1{font-size:18px}
  .desktop-only{display:none!important}
  .topbar .mobile-only{display:inline-grid}
  main{padding:16px 14px calc(var(--nav-h) + var(--safe-b) + 90px)}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:10.5px;position:relative;min-height:44px}
  .bottom-nav a svg{width:23px;height:23px}
  .bottom-nav a.active{color:var(--navy);font-weight:700}
  .bottom-nav a.active svg{color:var(--blue)}
  .bottom-nav .nav-badge{position:absolute;top:6px;left:calc(50% + 6px);margin:0;font-size:10px;line-height:16px;padding:0 5px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:58px;height:58px;border-radius:50%;border:0;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(22,50,92,.35);z-index:31}
  .fab svg{width:26px;height:26px}
}

/* ---------- 汎用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;margin:0;color:var(--navy)}
.card-h .count{color:var(--muted);font-size:13px}
.card-h .right{margin-left:auto}
.card-b{padding:14px 18px}
.section{margin-bottom:18px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
@media (max-width:899px){.grid-2{grid-template-columns:1fr}.card-h{padding:12px 14px}.card-b{padding:12px 14px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--sky)}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-sky{background:var(--sky);border-color:var(--sky-2)}
.btn-danger{color:var(--red);border-color:#f3c5ce}
.btn-danger:hover{background:var(--red-bg)}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn-lg{min-height:48px;padding:12px 18px;font-size:15px}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--navy)}
.icon-btn:hover{background:var(--sky)}
.icon-btn svg{width:21px;height:21px}
@media (max-width:899px){.btn{min-height:44px}.btn-sm{min-height:38px}}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--line-2);color:var(--sub);white-space:nowrap;line-height:20px}
.chip .dot{width:7px;height:7px;border-radius:50%}
.pri{font-size:11.5px;font-weight:700;border-radius:5px;padding:0 6px;line-height:19px}
.pri-high{background:var(--red-bg);color:var(--red)}
.pri-mid{background:var(--sky);color:var(--navy-2)}
.pri-low{background:var(--line-2);color:var(--muted)}
.late{background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;line-height:21px;white-space:nowrap}
.late-soft{background:var(--orange-bg);color:var(--orange)}
.ok-badge{background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;line-height:21px}
.muted{color:var(--muted)}
.sub{color:var(--sub)}
.small{font-size:12.5px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{width:34px;height:34px;color:#bccbdc;display:block;margin:0 auto 6px}

/* ---------- 統計 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;text-decoration:none;color:inherit;display:block}
.stat .label{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat .value{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .value small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.stat.alert .value{color:var(--red)}
.stat .bar{height:6px;background:var(--line-2);border-radius:4px;margin-top:8px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#5bb4f3,#2f8fdc);border-radius:4px}
@media (max-width:899px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px 14px}.stat .value{font-size:25px}}

.hero{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px 18px;margin-bottom:18px;background:linear-gradient(135deg,#16325c,#24497f);color:#fff;border:0}
.hero .big{font-size:20px;font-weight:700}
.hero .sub{color:#c9d7ea;font-size:13px}
.hero .tag{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 12px;font-size:13px;white-space:nowrap}

/* ---------- タスク行 ---------- */
.tlist{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line-2);cursor:pointer;position:relative}
.trow:last-child{border-bottom:0}
.trow:hover{background:#fafcfe}
.trow .cbar{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
.check{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:2px solid #b7c6d8;background:#fff;display:grid;place-items:center;margin-top:1px;color:transparent;padding:0}
.check:hover{border-color:var(--blue);color:#b7c6d8}
.check svg{width:16px;height:16px}
.trow.done .check{background:var(--green);border-color:var(--green);color:#fff}
.tmain{flex:1;min-width:0}
.ttitle{font-weight:600;font-size:15px;word-break:break-word}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted);font-weight:500}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--sub)}
.tmeta .shift{color:var(--orange)}
.tmemo{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:899px){.trow{padding:12px 14px}.check{flex-basis:32px;width:32px;height:32px}}

/* 未完了カード */
.pcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line-2);align-items:center;cursor:pointer}
.pcard:last-child{border-bottom:0}
.pcard:hover{background:#fafcfe}
.pcard .ptitle{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pfields{display:grid;grid-template-columns:repeat(3,minmax(0,auto));gap:2px 22px;margin-top:6px;font-size:13px;justify-content:start}
.pfields dt{color:var(--muted);font-size:11.5px}
.pfields dd{margin:0;font-weight:600;color:var(--text)}
.pfields dd.red{color:var(--red)}
.done-btn{min-width:96px}
@media (max-width:899px){.pcard{grid-template-columns:1fr;padding:14px}.done-btn{width:100%}.pfields{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px;font-size:12.5px}.seg button{padding:6px 10px}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--sub);font-weight:600;min-height:32px}
.seg button.on{background:var(--navy);color:#fff}
.seg button .n{font-size:11.5px;opacity:.8;margin-left:3px}

/* ---------- フォーム ---------- */
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;border:1px solid #cfdae7;background:#fff;border-radius:9px;padding:9px 11px;font-size:15px;min-height:42px;outline:none}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,143,220,.15)}
textarea.input{min-height:80px;resize:vertical}
@media (max-width:899px){.input,select.input,textarea.input{font-size:16px;min-height:46px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cols-2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.warn{color:var(--orange)}
.radio-seg{display:flex;gap:6px;flex-wrap:wrap}
.radio-seg label{flex:1;min-width:64px}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:block;text-align:center;border:1px solid #cfdae7;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--sub);background:#fff;cursor:pointer}
.radio-seg input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.radio-seg input:focus-visible+span{box-shadow:0 0 0 3px rgba(47,143,220,.3)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:36px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto;min-width:110px}
.preview{background:var(--sky);border:1px solid var(--sky-2);border-radius:10px;padding:10px 12px;font-size:13px}
.preview table{width:100%;border-collapse:collapse}
.preview td{padding:3px 4px;vertical-align:top}
.preview .arrow{color:var(--orange);font-weight:700}
.info-box{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--navy-2);margin-bottom:14px}
.check-line{display:flex;align-items:flex-start;gap:8px;font-size:14px;cursor:pointer}
.check-line input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy)}

/* ---------- モーダル ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,30,55,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,30,55,.3)}
.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:17px;color:var(--navy)}
.modal-h .icon-btn{margin-left:auto;margin-right:-8px}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media (max-width:899px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;animation:up .2s ease-out}
  .modal-f{padding-bottom:calc(14px + var(--safe-b))}
  .modal-f .btn{flex:1}
  .modal-f .left{flex:0 0 auto}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#1b2738;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;max-width:calc(100vw - 24px)}
.toast button{background:transparent;border:0;color:#7cc4ff;font-weight:700;padding:6px 8px}
@media (max-width:899px){.toast{bottom:calc(var(--nav-h) + var(--safe-b) + 86px)}}

/* ---------- 設定 ---------- */
.set-list{list-style:none;margin:0;padding:0}
.set-list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.set-list li:last-child{border-bottom:0}
.color-in{width:40px;height:36px;border:1px solid #cfdae7;border-radius:8px;padding:2px;background:#fff}
.tpl-card{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:14px;align-items:flex-start}
.tpl-card:last-child{border-bottom:0}
.tpl-card.paused{opacity:.6}
.tpl-when{font-size:13px;color:var(--navy-2);font-weight:600}
.tpl-next{font-size:12.5px;color:var(--sub);margin-top:4px}
.tpl-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:899px){.tpl-card{flex-direction:column;padding:14px}.tpl-actions{margin-left:0;justify-content:flex-start}}
.hol-table{width:100%;border-collapse:collapse;font-size:13.5px}
.hol-table td{padding:6px 4px;border-bottom:1px solid var(--line-2)}
pre.json{background:#0f1e37;color:#cfe3ff;border-radius:10px;padding:12px;font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13.5px}
.kv dt{color:var(--sub)}.kv dd{margin:0;font-weight:600}
.pfields dd.shiftd{color:var(--orange)}

/* =========================================================
 * v2 追加スタイル
 * ========================================================= */
.i13{width:13px;height:13px;vertical-align:-2px}
.spacer{flex:1}
.hi-mark{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;margin-right:4px;vertical-align:1px;flex:0 0 15px;line-height:1}
.toast-err{background:#8f1d33}
.save-error{display:flex;align-items:center;gap:10px;background:var(--red-bg);color:var(--red);border-bottom:1px solid #f3c5ce;padding:10px 28px;font-size:13.5px;font-weight:600}
.save-error svg{width:20px;height:20px;flex:0 0 20px}
.save-error .btn{margin-left:auto}
.mobile-block{display:none}
@media (max-width:899px){.mobile-block{display:block}.save-error{padding:10px 14px}}
.topbar .tb-btn{display:inline-flex}
.icon-btn.on{background:var(--sky);color:var(--blue)}

/* タブ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:10px 16px;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.tabs .n{font-size:12px;background:var(--line-2);border-radius:10px;padding:0 7px;margin-left:4px}
.tabs button.on .n{background:var(--sky);color:var(--navy)}

/* ---------- カレンダー v2 ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cal-head .ttl{font-size:18px;font-weight:700;color:var(--navy);min-width:110px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);padding:8px 0;border-bottom:1px solid var(--line-2)}
.cal-dow.sun{color:var(--sun)}.cal-dow.sat{color:var(--sat)}
.cal-cell{min-height:132px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 5px 6px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;outline:none}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:#fbfdff}
.cal-cell:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}
.cal-cell.other{background:#fafbfd}
.cal-cell.other .dnum,.cal-cell.other .ci-list{opacity:.5}
.cal-cell.off{background:#fff7f8}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.dnum{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;min-height:24px}
.dnum .n{min-width:24px;height:24px;display:inline-grid;place-items:center;border-radius:50%}
.cal-cell.today .dnum .n{background:var(--navy);color:#fff}
.dnum.sun,.dnum.hol,.wk-h.sun,.wk-h.hol{color:var(--sun)}.dnum.sat,.wk-h.sat{color:var(--sat)}
.hname{font-size:10.5px;color:var(--sun);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.cell-add{margin-left:auto;border:0;background:transparent;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--blue);opacity:0;padding:0;flex:0 0 22px}
.cell-add svg{width:15px;height:15px}
.cal-cell:hover .cell-add,.wk-day:hover .cell-add,.cell-add:focus-visible{opacity:1}
.cell-add:hover{background:var(--sky)}
.ci-list{display:flex;flex-direction:column;gap:2px;min-width:0}
.ci{display:block;font-size:12px;line-height:19px;padding:0 4px 0 5px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border-left:3px solid;min-width:0}
.ci-open{background:#e6f2fd;color:#0f4c8a;border-left-color:var(--blue)}
.ci-over{background:var(--red-bg);color:#b3243e;border-left-color:var(--red)}
.ci-done{background:#f0f2f5;color:#98a3b1;border-left-color:#c8d0da;text-decoration:line-through}
.ci.hi{font-weight:700}
.ci .hi-mark{display:inline;width:auto;height:auto;background:none;color:var(--red);font-size:12px;font-weight:900;margin-right:2px;vertical-align:0}
.ci-done .hi-mark{color:inherit}
.ci:hover{filter:brightness(.96)}
.ci:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.cmore{font-size:11.5px;color:var(--navy-2);font-weight:600;padding:0 6px;cursor:pointer}
.cmore:hover{text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--sub);border-top:1px solid var(--line-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:14px;height:11px;border-radius:2px;display:inline-block;border-left:3px solid}
.lg-open{background:#e6f2fd;border-color:var(--blue)}.lg-over{background:var(--red-bg);border-color:var(--red)}.lg-done{background:#f0f2f5;border-color:#c8d0da}
.lg-t.sun{color:var(--sun)}.lg-t.sat{color:var(--sat)}
/* 週表示 */
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk-day{border-right:1px solid var(--line-2);min-height:360px;cursor:pointer;outline:none;min-width:0}
.wk-day:last-child{border-right:0}
.wk-day.off{background:#fff7f8}
.wk-day.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.wk-h{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line-2);font-weight:700;flex-wrap:wrap}
.wk-h .n{font-size:18px;min-width:30px;height:30px;display:inline-grid;place-items:center;border-radius:50%}
.wk-day.today .wk-h .n{background:var(--navy);color:#fff}
.wk-h .w{font-size:12px}
.wk-h .hname{flex-basis:100%}
.wk-list{display:flex;flex-direction:column;gap:4px;padding:6px}
.wk-list .ci{white-space:normal;line-height:1.4;padding:4px 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wk-empty{color:#c5cfdb;text-align:center;font-size:13px}
@media (max-width:899px){
  .cal-head{padding:10px}
  .cal-head .ttl{font-size:17px;min-width:96px}
  .cal-cell{min-height:92px;padding:3px 2px 4px;gap:2px}
  .dnum{justify-content:center;min-height:22px}
  .dnum .n{min-width:24px;height:24px;font-size:13px}
  .cal-cell .hname{display:none}
  .ci{font-size:11px;line-height:17px;padding:0 2px 0 3px;border-left-width:2px;text-overflow:clip;pointer-events:none}
  .ci .hi-mark{display:none}
  .ci.hi{font-weight:800}
  .cmore{font-size:10.5px;padding:0 2px;pointer-events:none}
  .cal-dow{font-size:12px}
  .legend{gap:10px;font-size:11.5px}
  .wk-grid{grid-template-columns:1fr}
  .wk-day{min-height:0;border-right:0;border-bottom:1px solid var(--line-2);cursor:default}
  .wk-h{padding:8px 12px}
  .wk-list{padding:0}
  .wk-list .tlist{margin:0}
  .wk-empty{padding:4px 12px 10px;text-align:left}
}
@media (max-width:370px){.ci{font-size:10.5px}}
.sheet-list .trow{padding-left:4px;padding-right:4px}

/* ---------- タスク追加フォーム ---------- */
.input-lg{font-size:16px;min-height:46px;font-weight:600}
.input.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,69,93,.15)}
.rep-seg span{padding:10px 4px}
.rep-sub{display:flex;align-items:center;gap:8px;margin-top:10px}
.rep-sub>span{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap}
.rep-sub .input{width:auto;flex:1;min-width:0}
.rep-fixed{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sky);border-radius:9px;padding:9px 12px;font-weight:600;color:var(--navy)}
.rep-fixed .btn{margin-left:auto}
.ef-hint{min-height:20px;margin:-4px 0 12px}
.ef-hint .warn{color:var(--orange)}
.adv{border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.adv summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy);font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:'';width:8px;height:8px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.adv[open] summary::before{transform:rotate(45deg)}
.adv-b{padding:4px 14px 14px}
.btn-wide{min-width:120px}

/* ---------- 付箋（共通） ---------- */
#sticky-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:899px){body:not(.note-mode) #sticky-layer{display:none}}
.sticky{--st-bg:#fff8c4;--st-bd:#ecd977;--st-head:#fbeea0;--st-op:1;position:fixed;pointer-events:auto;display:flex;flex-direction:column;background:var(--st-bg);border:1px solid var(--st-bd);border-radius:10px;box-shadow:0 10px 28px rgba(22,50,92,.18),0 2px 6px rgba(22,50,92,.08);opacity:var(--st-op);transition:opacity .15s;overflow:hidden;color:#2a3342}
.sticky:hover,.sticky:focus-within,.sticky.moving{opacity:1}
.sticky.moving{box-shadow:0 18px 40px rgba(22,50,92,.28);user-select:none}
.sticky[data-color=blue]{--st-bg:#e9f4fe;--st-bd:#b7d9f6;--st-head:#d5eafc}
.sticky[data-color=green]{--st-bg:#eaf7ef;--st-bd:#b8e0c6;--st-head:#d4efdd}
.sticky[data-color=pink]{--st-bg:#fdecf2;--st-bd:#f2bfd0;--st-head:#fad7e3}
.sticky[data-color=white]{--st-bg:#ffffff;--st-bd:#dbe3ed;--st-head:#f2f6fa}
.st-head{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 10px;background:var(--st-head);cursor:grab;touch-action:none;flex:0 0 auto}
.sticky.moving .st-head{cursor:grabbing}
.st-ttl{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden}
.st-ttl svg{width:16px;height:16px;flex:0 0 16px;color:#6a5a12}
.sticky[data-color=blue] .st-ttl svg,.sticky[data-color=white] .st-ttl svg{color:var(--navy-2)}
.st-ttl b{overflow:hidden;text-overflow:ellipsis}
.st-d{font-size:12px;color:#6b7280}
.st-cnt{background:var(--navy);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.st-btn{border:0;background:transparent;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#4b5563;padding:0;flex:0 0 28px}
.st-btn:hover{background:rgba(0,0,0,.07)}
.st-btn svg{width:16px;height:16px}
.st-body{flex:1;overflow:auto;padding:4px 12px 8px}
.sticky.collapsed .st-body,.sticky.collapsed .st-add,.sticky.collapsed .st-resize,.sticky.collapsed .st-settings,.sticky.collapsed .st-text{display:none}
.st-sec{margin-top:8px}
.st-sec h4{margin:0 0 4px;font-size:12.5px;color:#5b4d0f;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.sticky:not([data-color=yellow]) .st-sec h4{color:var(--navy-2)}
.st-sec h4 small{font-weight:500;color:#7a7f87}
.st-sec h4 span{margin-left:auto;font-size:11px;background:rgba(0,0,0,.07);border-radius:9px;padding:0 7px;color:#555}
.st-sec-overdue h4{color:var(--red)!important}
.st-sec ul{list-style:none;margin:0;padding:0}
.st-item{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,.08);flex-wrap:wrap}
.st-item:last-child{border-bottom:0}
.st-check{flex:0 0 20px;cursor:pointer;position:relative;margin-top:1px}
.st-check input{position:absolute;opacity:0;width:20px;height:20px;margin:0;cursor:pointer}
.st-check .box{width:18px;height:18px;border:1.8px solid #8d95a1;border-radius:4px;background:rgba(255,255,255,.7);display:grid;place-items:center;color:transparent}
.st-check .box svg{width:13px;height:13px}
.st-check input:checked+.box{background:var(--green);border-color:var(--green);color:#fff}
.st-check input:focus-visible+.box{box-shadow:0 0 0 3px rgba(47,143,220,.35)}
.st-title{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;font-size:13.5px;line-height:1.45;color:inherit;cursor:pointer;word-break:break-word}
.st-title:hover{text-decoration:underline}

<script>
/* ============================================================
 * 経理タスク管理 — コアロジック（UI非依存・純粋関数中心）
 *   - 日付ユーティリティ（タイムゾーンに依存しない YYYY-MM-DD 文字列演算）
 *   - 日本の祝日計算（祝日法に基づくアルゴリズム＋特例）
 *   - 営業日判定・休日シフト
 *   - 定期タスクの発生日計算・自動生成（重複防止）
 *   - 集計、マージ（将来のクラウド同期用）、バックアップ検証
 * ============================================================ */
const Core = (() => {
  'use strict';

  /* ---------------- 日付ユーティリティ ---------------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
  const toUTC = (s) => { const { y, m, d } = parse(s); return Date.UTC(y, m - 1, d); };
  const fromUTC = (t) => { const dt = new Date(t); return ymd(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); };
  const addDays = (s, n) => fromUTC(toUTC(s) + n * 86400000);
  const diffDays = (a, b) => Math.round((toUTC(a) - toUTC(b)) / 86400000); // a - b
  const dow = (s) => new Date(toUTC(s)).getUTCDay(); // 0=日
  const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const addMonths = (y, m, n) => { const t = (y * 12 + (m - 1)) + n; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
  const monthKey = (s) => s.slice(0, 7);
  const isValidDate = (s) => {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const { y, m, d } = parse(s); return m >= 1 && m <= 12 && d >= 1 && d <= lastDay(y, m);
  };
  const todayLocal = () => {
    if (typeof globalThis !== 'undefined' && globalThis.__KT_TODAY__) return globalThis.__KT_TODAY__;
    const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate());
  };
  const startOfWeek = (s) => addDays(s, -((dow(s) + 6) % 7)); // 月曜始まり
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const fmtJP = (s, withDow = true) => { if (!s) return '—'; const { y, m, d } = parse(s); return `${y}/${m}/${d}` + (withDow ? `(${WD[dow(s)]})` : ''); };
  const fmtShort = (s) => { if (!s) return '—'; const { m, d } = parse(s); return `${m}/${d}(${WD[dow(s)]})`; };

  /* ---------------- 日本の祝日 ----------------
   * 「国民の祝日に関する法律」に基づき計算（2000年〜2099年対応）。
   * 春分・秋分は国立天文台の暦要項と一致する近似式（1980–2099年有効）。
   * 法改正による特例（2019年の御即位、2020/2021年の五輪特措法）も反映。
   * 振替休日（2007年〜：日曜の祝日以降の最初の平日）と
   * 国民の休日（祝日に挟まれた平日）も自動計算。 */
  const nthMonday = (y, m, n) => { const first = dow(ymd(y, m, 1)); const d = 1 + ((8 - first) % 7) + (n - 1) * 7; return ymd(y, m, d); };
  const vernal = (y) => Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  const autumnal = (y) => Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  const holidayCache = new Map();

  function baseHolidays(y) {
    const h = new Map();
    const put = (m, d, name) => h.set(typeof m === 'string' ? m : ymd(y, m, d), name);
    put(1, 1, '元日');
    put(nthMonday(y, 1, 2), null, '成人の日');
    put(2, 11, '建国記念の日');
    if (y >= 2020) put(2, 23, '天皇誕生日');
    put(3, vernal(y), '春分の日');
    put(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
    put(5, 3, '憲法記念日');
    if (y >= 2007) put(5, 4, 'みどりの日');
    put(5, 5, 'こどもの日');
    // 海の日
    if (y === 2020) put(7, 23, '海の日'); else if (y === 2021) put(7, 22, '海の日'); else if (y >= 2003) put(nthMonday(y, 7, 3), null, '海の日'); else put(7, 20, '海の日');
    // 山の日
    if (y === 2020) put(8, 10, '山の日'); else if (y === 2021) put(8, 8, '山の日'); else if (y >= 2016) put(8, 11, '山の日');
    // 敬老の日
    if (y >= 2003) put(nthMonday(y, 9, 3), null, '敬老の日'); else put(9, 15, '敬老の日');
    put(9, autumnal(y), '秋分の日');
    // スポーツの日（体育の日）
    if (y === 2020) put(7, 24, 'スポーツの日'); else if (y === 2021) put(7, 23, 'スポーツの日'); else put(nthMonday(y, 10, 2), null, y >= 2020 ? 'スポーツの日' : '体育の日');
    put(11, 3, '文化の日');
    put(11, 23, '勤労感謝の日');
    if (y >= 1989 && y <= 2018) put(12, 23, '天皇誕生日');
    // 特例
    if (y === 2019) { put(5, 1, '天皇の即位の日'); put(10, 22, '即位礼正殿の儀'); }
    return h;
  }

  function holidaysOfYear(y) {
    if (holidayCache.has(y)) return holidayCache.get(y);
    const h = baseHolidays(y);
    // 国民の休日：前日と翌日が祝日である平日（日曜以外）
    const keys = [...h.keys()].sort();
    for (const k of keys) {
      const mid = addDays(k, 1), next = addDays(k, 2);
      if (h.has(next) && !h.has(mid) && dow(mid) !== 0 && mid.slice(0, 4) === String(y)) h.set(mid, '国民の休日');
    }
    // 振替休日：日曜の祝日 → 以降最初の「祝日でない日」
    const sorted = [...h.keys()].sort();
    for (const k of sorted) {
      if (dow(k) === 0) {
        let d = addDays(k, 1);
        if (y >= 2007) { while (h.has(d)) d = addDays(d, 1); }
        else if (h.has(d)) continue;
        if (!h.has(d)) h.set(d, '振替休日');
      }
    }
    const sortedMap = new Map([...h.entries()].sort((a, b) => a[0].localeCompare(b[0])));
    holidayCache.set(y, sortedMap);
    return sortedMap;
  }
  const holidayName = (s) => holidaysOfYear(parse(s).y).get(s) || null;

  /* ---------------- 営業日 ---------------- */
  // settings: { customHolidays: [{date,name}], closeYearEnd: boolean }
  function closedReason(s, settings) {
    const w = dow(s);
    if (w === 6) return '土曜日';
    if (w === 0) return '日曜日';
    const hn = holidayName(s); if (hn) return hn;
    if (settings) {
      const c = (settings.customHolidays || []).find((x) => x.date === s); if (c) return c.name || '休業日';
      if (settings.closeYearEnd) { const { m, d } = parse(s); if ((m === 12 && d === 31) || (m === 1 && d <= 3)) return '年末年始休業'; }
    }
    return null;
  }
  const isBusinessDay = (s, settings) => closedReason(s, settings) === null;
  /** 休日シフト。rule: 'prev'=直前の営業日 / 'next'=翌営業日 / 'none'=そのまま */
  function shiftDate(s, rule, settings) {
    if (rule === 'none') return s;
    if (rule === 'skip') return isBusinessDay(s, settings) ? s : null; // 休日は発生させない（毎日の「営業日のみ」用）
    const step = rule === 'next' ? 1 : -1;
    let d = s, guard = 0;
    while (!isBusinessDay(d, settings) && guard++ < 60) d = addDays(d, step);
    return d;
  }
  function nthBusinessDay(y, m, n, settings) {
    let d = ymd(y, m, 1), c = 0, guard = 0;
    while (guard++ < 62) { if (isBusinessDay(d, settings)) { c++; if (c === n) return d; } d = addDays(d, 1); }
    return d;
  }

  /* ---------------- 定期タスク ---------------- */
  const FREQ_LABEL = { daily: '毎日', weekly: '毎週', monthly: '毎月', yearly: '毎年' };
  const RULE_LABEL = { prev: '前の営業日に変更', next: '次の営業日に変更', none: '変更しない', skip: '休日は作成しない' };
  const PRIORITY = { high: '高', mid: '中', low: '低' };

  function dayOf(y, m, tpl, settings) {
    if (tpl.dayMode === 'last') return ymd(y, m, lastDay(y, m));
    if (tpl.dayMode === 'bizday') return nthBusinessDay(y, m, Math.max(1, Number(tpl.bizDay) || 1), settings);
    const d = Math.min(Number(tpl.day) || 1, lastDay(y, m));
    return ymd(y, m, d);
  }

  /** テンプレートの発生（元の予定日）を [from, to] で列挙 */
  function occurrences(tpl, from, to, settings) {
    const out = [];
    const start = tpl.startDate && tpl.startDate > from ? tpl.startDate : from;
    const end = tpl.endDate && tpl.endDate < to ? tpl.endDate : to;
    if (start > end) return out;
    const anchor = parse(tpl.startDate || start);
    if (tpl.freq === 'monthly') {
      const iv = Math.max(1, Number(tpl.interval) || 1);
      const s = parse(start), e = parse(end);
      let cur = { y: anchor.y, m: anchor.m };
      // 開始月をアンカーに interval ヶ月ごと
      while (cur.y * 12 + cur.m < s.y * 12 + s.m - 1) cur = addMonths(cur.y, cur.m, iv);
      let guard = 0;
      while (cur.y * 12 + cur.m <= e.y * 12 + e.m && guard++ < 2000) {
        const d = dayOf(cur.y, cur.m, tpl, settings);
        if (d >= start && d <= end) out.push({ periodKey: `${cur.y}-${pad(cur.m)}`, scheduledDate: d });
        cur = addMonths(cur.y, cur.m, iv);
      }
    } else if (tpl.freq === 'weekly') {
      const iv = Math.max(1, Number(tpl.interval) || 1);
      const wd = Number(tpl.weekday) || 0;
      const anchorDate = tpl.startDate || start;
      let d = addDays(anchorDate, (wd - dow(anchorDate) + 7) % 7);
      let guard = 0;
      while (d <= end && guard++ < 5000) {
        if (d >= start) out.push({ periodKey: d, scheduledDate: d });
        d = addDays(d, 7 * iv);
      }
    } else if (tpl.freq === 'daily') {
      let d = start, guard = 0;
      while (d <= end && guard++ < 1000) { out.push({ periodKey: d, scheduledDate: d }); d = addDays(d, 1); }
    } else if (tpl.freq === 'yearly') {
      const s = parse(start), e = parse(end);
      for (let y = s.y; y <= e.y; y++) {
        const m = Number(tpl.month) || 1;
        const d = dayOf(y, m, tpl, settings);
        if (d >= start && d <= end) out.push({ periodKey: String(y), scheduledDate: d });
      }
    }
    return out;
  }

  /** 1件の発生から 実行日・期限 を算出 */
  function resolveOccurrence(tpl, scheduledDate, settings) {

    b.innerHTML = `${ic('alert')}<span>${esc(msg || 'データをこの端末に保存できませんでした。容量不足やプライベートブラウズの可能性があります。今すぐ「設定 → バックアップを保存」でデータを退避してください。')}</span><a href="#config" class="btn btn-sm">設定を開く</a>`;
    b.classList.remove('hidden');
  }
  const isDesktop = () => window.matchMedia('(min-width: 900px)').matches;

  return { $, $$, esc, ic, toast, openModal, closeModal, modalOpen, confirmDialog, setSaveError, isDesktop };
})();

<script>
/* ============================================================
 * 保存・同期レイヤー
 *
 *  Local  : ブラウザの localStorage（常に使用。オフラインでも動作）
 *  Remote : クラウド同期アダプタ（任意）。次の4関数を持つオブジェクト
 *             init()      -> Promise<boolean>   使えるなら true
 *             loadAll()   -> Promise<chunks>    Core.toChunks と同じ形
 *             write(key, jsonString) -> Promise
 *             subscribe(onChunks)               他端末の変更を受け取る
 *           現在は Claude 上で開いたときの同期のみ実装（ClaudeRemote）。
 *           GitHub Pages で Supabase 等を使う場合は README の手順で
 *           同じ形のアダプタを作り Store.useRemote(adapter) するだけで同期できる。
 *  Store  : アプリ全体で唯一のデータ（タスク・付箋・メモ）。画面・付箋パネル・
 *           別ウィンドウの付箋はすべてこの同じデータを参照する（二重管理なし）。
 * ============================================================ */
const Storage = (() => {
  'use strict';
  const C = Core;
  const KEY = 'keiri-task.v1'; // ※既存データ互換のため v1 のキー名を維持
  const KEY_DAILY = KEY + '.daily', KEY_BEFORE_RESTORE = KEY + '.before-restore';

  const Local = {
    ok: true, error: null,
    load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { this.ok = false; this.error = e; return null; } },
    save(state) {
      try {
        const str = JSON.stringify(state);
        const today = C.todayLocal(); const d = localStorage.getItem(KEY_DAILY + '.date');
        if (d !== today) { const prev = localStorage.getItem(KEY); if (prev) { localStorage.setItem(KEY_DAILY, prev); localStorage.setItem(KEY_DAILY + '.date', today); } }
        localStorage.setItem(KEY, str);
        // 書き込み確認（まれに黙って失敗する環境への対策）
        if (localStorage.getItem(KEY) !== str) throw new Error('verify failed');
        this.ok = true; this.error = null; return true;
      } catch (e) { this.ok = false; this.error = e; console.error('save failed', e); return false; }
    },
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } },
  };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* noop */ }

  /* ---- Claude 上で開いたときのクラウド同期アダプタ ---- */
  const ClaudeRemote = {
    col: null,
    async init() {
      if (!window.claude || typeof window.claude.use !== 'function') return false;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return false;
      const id = await user.id(); if (!id) return false;
      this.col = db.collection('data/users/' + id); return true;
    },
    async loadAll() {
      const snap = await this.col.get(); const out = {};
      for (const d of snap.docs) { const b = d.data(); if (b && typeof b.json === 'string') out[d.id] = b.json; }
      return out; // key -> json string
    },
    async write(key, json) { await this.col.doc(key).set({ json, at: Date.now() }); },
    subscribe(onRaw, onDead) {
      return this.col.onSnapshot((snap) => { const out = {}; for (const d of snap.docs) { const b = d.data(); if (b && typeof b.json === 'string') out[d.id] = b.json; } onRaw(out); }, onDead);
    },
  };

  /* ---- 同期エンジン（アダプタに依存しない部分） ---- */
  const Sync = {
    remote: null, status: 'local', msg: null, sent: {}, timer: null, pushing: false, again: false, listeners: new Set(),
    setStatus(s, msg) { this.status = s; this.msg = msg || null; this.listeners.forEach((f) => f()); },
    schedule() { if (!this.remote) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 900); },
    async push() {
      if (!this.remote) return; if (this.pushing) { this.again = true; return; }
      this.pushing = true; this.setStatus('busy');
      try {
        for (const [k, v] of Object.entries(C.toChunks(Store.state))) {
          const str = JSON.stringify(v); if (this.sent[k] === str) continue;
          for (let tries = 0; ; tries++) {
            try { await this.remote.write(k, str); break; } catch (e) {
              if (e && e.code === 'unavailable' && tries < 2) { await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); continue; }
              throw e;
            }
          }
          this.sent[k] = str;
        }
        this.setStatus('ok');
      } catch (e) {
        console.warn('sync error', e); this.setStatus('error', e && e.code === 'quota_exceeded' ? 'クラウドの容量上限に達しました' : 'クラウドに保存できませんでした（この端末には保存済み）');
      } finally { this.pushing = false; if (this.again) { this.again = false; this.schedule(); } }
    },
    applyRaw(raw) {
      const chunks = {}; let changed = false;
      for (const [k, str] of Object.entries(raw)) { if (this.sent[k] === str) continue; try { chunks[k] = JSON.parse(str); this.sent[k] = str; changed = true; } catch (e) { /* skip */ } }
      if (!changed) return false;
      if (!chunks.meta && this.sent.meta) chunks.meta = JSON.parse(this.sent.meta);
      Store.mergeIn(C.fromChunks(chunks), 'remote');
      return true;
    },
    async start(adapter) {
      this.setStatus('connecting');
      try {
        if (!(await adapter.init())) { this.setStatus('local'); return; }
        this.remote = adapter;
        const raw = await adapter.loadAll();
        if (raw.meta) this.applyRaw(raw); else Object.assign(this.sent, raw);
        this.setStatus('ok'); await this.push();
        const sub = () => adapter.subscribe((r) => { if (this.applyRaw(r)) this.schedule(); }, (e) => { console.warn('subscription ended', e); if (!e || e.code !== 'revoked') setTimeout(sub, 5000); });
        sub();
      } catch (e) { console.warn(e); this.setStatus(this.remote ? 'error' : 'local', this.remote ? '同期に失敗しました' : null); }
    },
    text() {
      return { local: 'この端末（ブラウザ）に保存', connecting: '接続中…', ok: 'この端末＋クラウド（同期済み）', busy: 'この端末＋クラウド（同期中…）', error: 'この端末に保存（' + (this.msg || 'クラウド同期エラー') + '）' }[this.status];
    },
  };

  /* ---- Store：唯一のデータ ---- */
  const Store = {
    state: null, subs: new Set(),
    init() {
      const raw = Local.load();
      this.state = C.normalize(raw || C.emptyState());
      const migrated = raw && raw.schema !== C.SCHEMA;
      const made = C.generate(this.state, C.todayLocal()).length;
      if (!raw || migrated || made) this.persist();
      return { migrated, made };
    },
    subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
    emit(reason) { this.subs.forEach((f) => { try { f(reason); } catch (e) { console.error(e); } }); },
    persist() {
      const ok = Local.save(this.state);
      UI.setSaveError(!ok);
      if (!ok) UI.toast('保存に失敗しました。バックアップを取得してください', null, { error: true });
      Sync.schedule(); return ok;
    },
    /** 変更を確定：保存 → 全画面へ通知。undo=true なら「元に戻す」付きトースト */
    commit(message, mutate, { undo = true, reason = 'data' } = {}) {
      const before = undo ? JSON.parse(JSON.stringify(this.state)) : null;
      const result = mutate(this.state);
      this.persist(); this.emit(reason);
      if (message) UI.toast(message, undo ? () => this.undoTo(before) : null);
      return result;
    },
    undoTo(before) {
      const now = Date.now(); const s = this.state;
      for (const coll of ['tasks', 'templates', 'categories', 'memos']) {
        const ids = new Set([...Object.keys(before[coll] || {}), ...Object.keys(s[coll] || {})]);
        for (const id of ids) {
          const a = before[coll][id], b = s[coll][id];
          if (JSON.stringify(a) === JSON.stringify(b)) continue;
          s[coll][id] = a ? { ...a, updatedAt: now } : { id, purged: true, deleted: true, deletedAt: now, updatedAt: now };
        }
      }
      s.genLog = { ...before.genLog, ...s.genLog };
      if (JSON.stringify(before.settings) !== JSON.stringify(s.settings)) s.settings = { ...before.settings, updatedAt: now };
      if (JSON.stringify(before.panel) !== JSON.stringify(s.panel)) s.panel = { ...before.panel, updatedAt: now };
      this.persist(); this.emit('data'); UI.toast('元に戻しました');
    },
    replace(next) { this.state = next; C.generate(this.state, C.todayLocal()); this.persist(); this.emit('data'); },
    /** 他のタブ・別ウィンドウ・他端末の変更を取り込む */
    mergeIn(other, source) {
      const before = JSON.stringify(this.state);
      this.state = C.merge(this.state, other); C.generate(this.state, C.todayLocal());
      if (JSON.stringify(this.state) === before) return false;
      if (source === 'remote') Local.save(this.state);
      this.emit(source); return true;
    },
  };

  // 同じブラウザの別タブ・別ウィンドウ（付箋ウィンドウなど）との連動
  window.addEventListener('storage', (e) => {
    if (e.key === KEY && e.newValue) { try { Store.mergeIn(C.normalize(JSON.parse(e.newValue)), 'tab'); } catch (err) { /* noop */ } }
  });

  return { Local, Sync, Store, ClaudeRemote, KEY, KEY_DAILY, KEY_BEFORE_RESTORE };
})();

</script>
<script>
/* ============================================================
 * 付箋パネル（タスク）とメモ付箋
 *  - PC（幅900px以上）でのみ画面上に浮かべて表示。スマホでは表示しない
 *  - 表示内容は Store.state のタスクをそのまま参照（データの二重管理なし）
 *  - 位置・サイズ・透明度・色・折りたたみ・表示内容は state.panel / state.memos に保存
 *  - #note で開くと付箋だけを全面表示（別ウィンドウ・将来のデスクトップアプリ用）
 * ============================================================ */
const Sticky = (() => {
  'use strict';
  const C = Core; const { $, $$, esc, ic } = UI; const Store = Storage.Store;
  const COLORS = { yellow: '付箋イエロー', blue: '水色', green: 'グリーン', pink: 'ピンク', white: 'ホワイト' };
  let layer, zTop = 50, dragging = false, settingsOpen = false;
  const isNoteMode = () => location.hash === '#note';
  const enabled = () => isNoteMode() || UI.isDesktop();
  const today = () => C.todayLocal();

  /* ---------- パネルの中身：ミニカレンダー＋タスク一覧（Storeのタスクをそのまま使う） ---------- */
  const MODES = { today: '今日', week: '今週', all: '未完了', date: '選択日' };
  let calMonth = null; // 表示中の月（画面上の一時的な状態）
  const allTasks = () => Object.values(Store.state.tasks).filter(C.alive);
  function listFor(mode, sel) {
    const td = today(); const all = allTasks();
    const ws = C.startOfWeek(td), we = C.addDays(ws, 6);
    let inScope;
    if (mode === 'date') inScope = (t) => t.executionDate === sel;
    else if (mode === 'week') inScope = (t) => (t.executionDate >= ws && t.executionDate <= we) || (t.dueDate && t.dueDate >= ws && t.dueDate <= we);
    else if (mode === 'all') inScope = () => true;
    else inScope = (t) => t.executionDate === td || t.dueDate === td;
    // 今日・今週は、期限を過ぎた未完了も先頭に含める（見落とし防止）
    const open = all.filter((t) => t.status !== 'done' && (inScope(t) || (mode !== 'date' && C.isOverdue(t, td))));
    const done = all.filter((t) => t.status === 'done' && (mode === 'all' ? t.completedAt && isoDate(t.completedAt) === td : inScope(t)))
      .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    return { open: C.panelSort(open, td), done };
  }
  const addDate = () => { const p = Store.state.panel; return p.mode === 'date' && p.selDate ? p.selDate : today(); };
  const isoDate = (ms) => { const d = new Date(ms); return C.ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  // 互換用（ほかの画面からの参照）
  function sections() { const r = listFor('today'); return { overdue: r.open.filter((t) => C.isOverdue(t, today())), today: r.open, open: listFor('all').open }; }

  function miniCalHtml() {
    const p = Store.state.panel; const td = today(); const sel = p.mode === 'date' && p.selDate ? p.selDate : null;
    if (!calMonth) calMonth = (sel || td).slice(0, 7);
    const [y, m] = calMonth.split('-').map(Number); const first = C.ymd(y, m, 1); const start = C.addDays(first, -C.dow(first));
    const weeks = Math.ceil((C.dow(first) + C.lastDay(y, m)) / 7);
    const by = {}; for (const t of allTasks()) (by[t.executionDate] = by[t.executionDate] || []).push(t);
    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = C.addDays(start, i); const list = by[d] || []; const w = C.dow(d); const hn = C.holidayName(d) || (w !== 0 && w !== 6 && C.closedReason(d, Store.state.settings));
      const open = list.filter((t) => t.status !== 'done'); const over = open.some((t) => C.isOverdue(t, td));
      const mark = !list.length ? '' : open.length ? `<i class="mk ${over ? 'mk-over' : 'mk-open'}"></i>${open.length > 1 ? `<i class="mk ${over ? 'mk-over' : 'mk-open'}"></i>` : ''}` : '<i class="mk mk-done"></i>';
      const label = `${C.fmtJP(d)}${hn ? ' ' + hn : ''}：${list.length ? `未完了${open.length}件・完了${list.length - open.length}件` : 'タスクなし'}`;
      cells += `<button type="button" class="mc-d ${d.slice(0, 7) !== calMonth ? 'oth' : ''} ${w === 0 || hn ? 'sun' : w === 6 ? 'sat' : ''} ${d === td ? 'tdy' : ''} ${d === sel ? 'sel' : ''} ${list.length && !open.length ? 'alldone' : ''}" data-st-day="${d}" aria-label="${esc(label)}" title="${esc(label)}"><span>${C.parse(d).d}</span><span class="mks">${mark}</span></button>`;
    }
    return `<div class="mc"><div class="mc-h"><button type="button" class="st-btn" data-st-cal="-1" aria-label="前月">${ic('left')}</button><b>${y}年${m}月</b><button type="button" class="st-btn" data-st-cal="1" aria-label="翌月">${ic('right')}</button><button type="button" class="mc-today" data-st-cal="today">今日</button></div>
      <div class="mc-g">${C.WD.map((w, i) => `<span class="mc-w ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</span>`).join('')}${cells}</div></div>`;
  }
  function itemHtml(t) {
    const td = today(); const late = C.delayDays(t, td); const st = t.status === 'done' ? 'done' : C.isOverdue(t, td) ? 'over' : C.refDate(t) === td ? 'tdy' : '';
    const due = t.dueDate ? `期限 ${C.fmtShort(t.dueDate)}` : `期限なし・予定 ${C.fmtShort(t.executionDate)}`;
    return `<li class="st-item ${st} ${t.priority === 'high' ? 'hi' : ''}">
      <label class="st-check"><input type="checkbox" data-st-toggle="${esc(t.id)}" ${t.status === 'done' ? 'checked' : ''} aria-label="${esc(t.title)}を${t.status === 'done' ? '未完了に戻す' : '完了にする'}"><span class="box">${ic('check')}</span></label>
      <div class="st-main"><button type="button" class="st-title" data-st-open="${esc(t.id)}" title="詳細を開く：${esc(t.title)}">${esc(t.title)}</button>
        <span class="st-meta"><span class="st-pri p-${t.priority || 'mid'}">${C.PRIORITY[t.priority || 'mid']}</span><span class="${st === 'over' ? 'st-late' : ''}">${due}</span>${late > 0 ? `<b class="st-late">${late}日遅れ</b>` : st === 'tdy' ? `<b class="st-tdy">${t.dueDate ? '今日期限' : '今日'}</b>` : ''}</span></div>
      <button type="button" class="st-btn st-open-btn" data-st-open="${esc(t.id)}" aria-label="${esc(t.title)}の詳細を開く">${ic('right')}</button></li>`;
  }
  function bodyHtml() {
    const p = Store.state.panel; const mode = MODES[p.mode] ? p.mode : 'today'; const sel = p.selDate || today();
    const { open, done } = listFor(mode, sel);
    const heading = mode === 'date' ? `${C.fmtJP(sel)}のタスク` : mode === 'today' ? '今日のタスク' : mode === 'week' ? '今週のタスク' : 'すべての未完了タスク';
    const empty = mode === 'date' ? 'この日のタスクはありません' : mode === 'today' && C.closedReason(today(), Store.state.settings) ? '今日は休日です。未完了はありません' : '未完了のタスクはありません';
    return `${p.miniCal ? miniCalHtml() : ''}
      <div class="st-modes" role="tablist" aria-label="表示切り替え">${Object.entries(MODES).map(([k, l]) => `<button type="button" role="tab" aria-selected="${mode === k}" class="${mode === k ? 'on' : ''}" data-st-mode="${k}">${k === 'date' && p.selDate ? C.fmtShort(p.selDate).replace(/\(.\)/, '') : l}</button>`).join('')}</div>
      <div class="st-list"><section class="st-sec"><h4>${esc(heading)}${mode === 'today' || mode === 'week' ? '<small>（期限超過を含む）</small>' : ''}<span>${open.length}</span></h4>
        ${open.length ? `<ul>${open.map(itemHtml).join('')}</ul>` : `<p class="st-empty">${empty}</p>`}</section>
      ${done.length ? `<section class="st-sec st-done"><button type="button" class="st-done-h" data-st-done aria-expanded="${!!p.showDone}">${ic(p.showDone ? 'down' : 'right')}完了済み${mode === 'all' ? '（今日）' : ''}<span>${done.length}</span></button>${p.showDone ? `<ul>${done.map(itemHtml).join('')}</ul>` : ''}</section>` : ''}</div>`;
  }
  function settingsHtml() {
    const p = Store.state.panel;
    return `<div class="st-settings">
      <label class="st-row">透明度<input type="range" min="40" max="100" step="5" value="${Math.round(p.opacity * 100)}" data-st-opacity aria-label="透明度"></label>
      <div class="st-row">背景色<span class="st-swatches">${Object.entries(COLORS).map(([k, l]) => `<button type="button" class="sw sw-${k} ${p.color === k ? 'on' : ''}" data-st-color="${k}" title="${l}" aria-label="${l}"></button>`).join('')}</span></div>
      <div class="st-row st-checks">表示<label><input type="checkbox" data-st-opt="miniCal" ${p.miniCal ? 'checked' : ''}>ミニカレンダー</label><label><input type="checkbox" data-st-opt="showDone" ${p.showDone ? 'checked' : ''}>完了済みを開く</label></div>
    </div>`;
  }

  /* ---------- 位置の補正 ---------- */
  function clampGeo(g, minW = 220, minH = 120) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.max(minW, Math.min(g.w || 300, vw - 16)), h = Math.max(minH, Math.min(g.h || 400, vh - 16));
    let x = g.x == null ? vw - w - 12 : g.x, y = g.y == null ? 12 : g.y;
    x = Math.max(8 - w + 80, Math.min(x, vw - 80)); y = Math.max(0, Math.min(y, vh - 44));
    return { x, y, w, h };
  }
  function applyGeo(el, g, collapsed) {
    el.style.left = g.x + 'px'; el.style.top = g.y + 'px'; el.style.width = g.w + 'px'; el.style.height = collapsed ? 'auto' : g.h + 'px';
  }

  /* ---------- 付箋パネル ---------- */
  function renderPanel() {
    let el = $('#st-panel');
    const p = Store.state.panel;
    const docked = p.x == null && !isNoteMode() && !p.collapsed && p.visible && UI.isDesktop();
    document.body.classList.toggle('st-docked', docked); document.body.style.setProperty('--st-w', Math.round(clampGeo(p).w) + 'px');
    if (!enabled() || (!p.visible && !isNoteMode())) { el && el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'st-panel'; el.className = 'sticky st-panel'; el.setAttribute('role', 'complementary'); el.setAttribute('aria-label', '付箋パネル'); layer.appendChild(el); bindDrag(el, 'panel'); }
    const body = $('.st-list', el); const scroll = body ? body.scrollTop : 0;
    const addIn = $('.st-add input', el); const addVal = addIn ? addIn.value : ''; const addFocus = addIn && document.activeElement === addIn;
    const open = Object.values(Store.state.tasks).filter((t) => C.alive(t) && t.status !== 'done' && t.executionDate <= today()).length;
    el.dataset.color = p.color; el.classList.toggle('collapsed', !!p.collapsed && !isNoteMode()); el.classList.toggle('note-full', isNoteMode());
    el.style.setProperty('--st-op', p.opacity);
    el.innerHTML = `<div class="st-head" data-drag>
        <span class="st-ttl">${ic('note')}<b>タスクパネル</b><span class="st-d">${C.fmtShort(today())}</span>${p.collapsed && !isNoteMode() ? `<span class="st-cnt">${open}件</span>` : ''}</span>
        <button type="button" class="st-btn" data-st-settings aria-label="付箋の設定" aria-expanded="${settingsOpen}">${ic('sliders')}</button>
        ${isNoteMode() ? '' : `<button type="button" class="st-btn" data-st-collapse aria-label="${p.collapsed ? '広げる' : '折りたたむ'}">${ic(p.collapsed ? 'down' : 'minus')}</button><button type="button" class="st-btn" data-st-hide aria-label="付箋を非表示">${ic('x')}</button>`}
      </div>
      ${settingsOpen ? settingsHtml() : ''}
      <div class="st-body">${bodyHtml()}</div>
      <form class="st-add"><input type="text" placeholder="＋ ${addDate() === today() ? '今日' : C.fmtShort(addDate())}のタスクを追加（Enter）" aria-label="タスクを追加" maxlength="120"></form>
      ${isNoteMode() ? '' : '<div class="st-resize" data-resize aria-hidden="true"></div>'}`;
    el.classList.toggle('docked', p.x == null && !isNoteMode());
    if (!isNoteMode()) { const g = clampGeo(p); if (p.x == null) { g.x = window.innerWidth - g.w - 12; g.y = 12; g.h = window.innerHeight - 24; } applyGeo(el, g, p.collapsed); }
    const nb = $('.st-list', el); if (nb) nb.scrollTop = scroll;
    const ni = $('.st-add input', el); if (ni) { ni.value = addVal; if (addFocus) ni.focus(); }
  }

  /* ---------- メモ付箋 ---------- */
  const memos = () => Object.values(Store.state.memos || {}).filter((m) => m && !m.deleted && !m.purged);
  function memoTitle(m) { const first = (m.text || '').split('\n')[0].trim(); return first ? first.slice(0, 24) : 'メモ'; }
  function renderMemos() {
    const want = enabled() && !isNoteMode() ? memos().filter((m) => m.pinned) : [];
    const ids = new Set(want.map((m) => m.id));
    $$('.st-memo', layer).forEach((el) => { if (!ids.has(el.dataset.id)) el.remove(); });
    want.forEach((m, i) => {
      let el = layer.querySelector(`.st-memo[data-id="${CSS.escape(m.id)}"]`);
      if (!el) {
        el = document.createElement('div'); el.className = 'sticky st-memo'; el.dataset.id = m.id; el.setAttribute('aria-label', 'メモ付箋');
        el.innerHTML = `<div class="st-head" data-drag><span class="st-ttl">${ic('pin')}<b class="mt"></b></span><button type="button" class="st-btn" data-memo-collapse aria-label="折りたたむ"></button><button type="button" class="st-btn" data-memo-unpin aria-label="画面から隠す">${ic('x')}</button></div>
          <textarea class="st-text" data-memo-text="${esc(m.id)}" placeholder="自由にメモ（自動保存）" aria-label="メモ"></textarea><div class="st-resize" data-resize aria-hidden="true"></div>`;
        el.style.zIndex = ++zTop; layer.appendChild(el); bindDrag(el, 'memo');
      }
      el.dataset.color = m.color || 'yellow'; el.classList.toggle('collapsed', !!m.collapsed);
      $('.mt', el).textContent = memoTitle(m);
      $('[data-memo-collapse]', el).innerHTML = ic(m.collapsed ? 'down' : 'minus');
      const ta = $('textarea', el); if (document.activeElement !== ta && ta.value !== (m.text || '')) ta.value = m.text || '';
      if (!dragging) applyGeo(el, clampGeo({ x: m.x ?? 260 + i * 28, y: m.y ?? 120 + i * 28, w: m.w || 240, h: m.h || 220 }, 180, 100), m.collapsed);
    });
  }

  /* ---------- メモの自動保存 ---------- */
  const memoTimers = {};
  function saveMemoText(id, text) {
    clearTimeout(memoTimers[id]);
    memoTimers[id] = setTimeout(() => {
      const m = Store.state.memos[id]; if (!m || m.text === text) return;
      Store.commit(null, (s) => { s.memos[id] = { ...s.memos[id], text, updatedAt: Date.now() }; }, { undo: false, reason: 'memo' });
      flashSaved(id);
    }, 400);
  }
  function flashSaved(id) { $$(`[data-memo-saved="${CSS.escape(id)}"]`).forEach((e) => { e.textContent = '保存しました'; clearTimeout(e._t); e._t = setTimeout(() => (e.textContent = ''), 1500); }); }
  function newMemo({ pinned = UI.isDesktop(), text = '' } = {}) {
    const id = C.uid('m'); const n = memos().length;
    Store.commit(null, (s) => { s.memos[id] = { id, text, color: ['yellow', 'blue', 'green', 'pink'][n % 4], pinned, collapsed: false, x: null, y: null, w: 240, h: 220, createdAt: Date.now(), updatedAt: Date.now() }; }, { undo: false });
    setTimeout(() => { const ta = layer.querySelector(`.st-memo[data-id="${CSS.escape(id)}"] textarea`) || document.querySelector(`[data-memo-text="${CSS.escape(id)}"]`); ta && ta.focus(); }, 30);
    return id;
  }

  /* ---------- ドラッグ・リサイズ ---------- */
  function bindDrag(el, kind) {
    el.addEventListener('pointerdown', (e) => {
      el.style.zIndex = ++zTop;
      const handle = e.target.closest('[data-drag]'); const rs = e.target.closest('[data-resize]');
      if (isNoteMode() || (!handle && !rs) || e.target.closest('button, input, select, textarea') || e.button !== 0) return;
      e.preventDefault(); dragging = true; el.classList.add('moving');
      const r = el.getBoundingClientRect(); const sx = e.clientX, sy = e.clientY;
      if (!rs && el.classList.contains('docked')) { el.classList.remove('docked'); el.style.height = Math.min(r.height, 640) + 'px'; document.body.classList.remove('st-docked'); }
      const move = (ev) => {
        if (rs && el.classList.contains('docked')) { const nw = Math.max(220, Math.min(560, r.width - (ev.clientX - sx))); el.style.width = nw + 'px'; el.style.left = (window.innerWidth - nw - 12) + 'px'; document.body.style.setProperty('--st-w', nw + 'px'); return; }
        if (rs) { el.style.width = Math.max(kind === 'panel' ? 220 : 180, r.width + ev.clientX - sx) + 'px'; el.style.height = Math.max(kind === 'panel' ? 160 : 100, r.height + ev.clientY - sy) + 'px'; }
        else { el.style.left = Math.max(-r.width + 80, Math.min(window.innerWidth - 80, r.left + ev.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(window.innerHeight - 44, r.top + ev.clientY - sy)) + 'px'; }
      };
      const up = () => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        dragging = false; el.classList.remove('moving');
        const b = el.getBoundingClientRect(); const geo = { x: Math.round(b.left), y: Math.round(b.top), w: Math.round(b.width) };
        const collapsed = el.classList.contains('collapsed'); if (!collapsed) geo.h = Math.round(b.height);
        if (kind === 'panel') { const wasDocked = Store.state.panel.x == null; const g2 = rs && wasDocked ? { w: geo.w } : geo; Store.commit(null, (s) => { s.panel = { ...s.panel, ...g2, updatedAt: Date.now() }; }, { undo: false, reason: 'data' }); }
        else { const id = el.dataset.id; Store.commit(null, (s) => { s.memos[id] = { ...s.memos[id], ...geo, updatedAt: Date.now() }; }, { undo: false, reason: 'panel' }); }
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  }

  /* ---------- 操作 ---------- */
  const setPanel = (patch, reason = 'panel') => Store.commit(null, (s) => { s.panel = { ...s.panel, ...patch, updatedAt: Date.now() }; }, { undo: false, reason });
  function onClick(e) {
    const t = e.target.closest('button'); if (!t || !layer.contains(t)) return;
    const d = t.dataset;
    if (d.stOpen) { App.openTask(d.stOpen); return; }
    if ('stSettings' in d) { settingsOpen = !settingsOpen; renderPanel(); return; }
    if ('stCollapse' in d) { setPanel({ collapsed: !Store.state.panel.collapsed }); return; }
    if ('stHide' in d) { setPanel({ visible: false }); UI.toast('付箋を非表示にしました（左メニュー「付箋」から再表示できます）'); return; }
    if (d.stColor) { setPanel({ color: d.stColor }); return; }
    if (d.stMode) { const patch = { mode: d.stMode }; if (d.stMode === 'date' && !Store.state.panel.selDate) patch.selDate = today(); setPanel(patch); return; }
    if (d.stDay) { calMonth = d.stDay.slice(0, 7); setPanel({ mode: 'date', selDate: d.stDay }); return; }
    if (d.stCal) { if (d.stCal === 'today') { calMonth = today().slice(0, 7); setPanel({ mode: 'today' }); return; } const [y, m] = (calMonth || today().slice(0, 7)).split('-').map(Number); const n = C.addMonths(y, m, Number(d.stCal)); calMonth = `${n.y}-${C.pad(n.m)}`; renderPanel(); return; }
    if ('stDone' in d) { setPanel({ showDone: !Store.state.panel.showDone }); return; }
    const memoEl = t.closest('.st-memo');
    if (memoEl) {
      const id = memoEl.dataset.id;
      if ('memoCollapse' in d) Store.commit(null, (s) => { s.memos[id] = { ...s.memos[id], collapsed: !s.memos[id].collapsed, updatedAt: Date.now() }; }, { undo: false, reason: 'panel' });
      if ('memoUnpin' in d) Store.commit('メモ付箋を画面から隠しました（「付箋」画面に残っています）', (s) => { s.memos[id] = { ...s.memos[id], pinned: false, updatedAt: Date.now() }; }, { reason: 'panel' });
    }
  }
  function onChange(e) {
    const t = e.target; if (!layer.contains(t)) return;
    if (t.dataset.stToggle) { App.toggleTask(t.dataset.stToggle, t.checked); return; }
    if (t.dataset.stOpt) { setPanel({ [t.dataset.stOpt]: t.checked }); return; }
    if ('stOpacity' in t.dataset) { setPanel({ opacity: Number(t.value) / 100 }); }
  }
  function onInput(e) {
    const t = e.target;
    if (t.dataset.memoText) { saveMemoText(t.dataset.memoText, t.value); const el = t.closest('.st-memo'); if (el) $('.mt', el).textContent = memoTitle({ text: t.value }); }
    if ('stOpacity' in t.dataset) { const p = $('#st-panel'); p && p.style.setProperty('--st-op', Number(t.value) / 100); }
  }
  function onSubmit(e) {
    const f = e.target.closest('.st-add'); if (!f || !layer.contains(f)) return; e.preventDefault();
    const inp = $('input', f); const title = inp.value.trim(); if (!title) return; inp.value = '';
    App.quickAdd(title, addDate());
  }

  function render(reason) {
    if (!layer) return;
    if (reason === 'memo') { renderMemos(); return; } // 入力中のメモを邪魔しない
    if (dragging && reason === 'panel') return;
    renderPanel(); renderMemos();
  }
  function init() {
    layer = document.createElement('div'); layer.id = 'sticky-layer'; document.body.appendChild(layer);
    layer.addEventListener('click', onClick); layer.addEventListener('change', onChange); layer.addEventListener('input', onInput); layer.addEventListener('submit', onSubmit);
    layer.addEventListener('focusout', (e) => { const t = e.target; if (t.dataset && t.dataset.memoText) { clearTimeout(memoTimers[t.dataset.memoText]); const m = Store.state.memos[t.dataset.memoText]; if (m && m.text !== t.value) Store.commit(null, (s) => { s.memos[m.id] = { ...m, text: t.value, updatedAt: Date.now() }; }, { undo: false, reason: 'memo' }); } });
    Store.subscribe(render);
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render('resize'), 120); });
    window.addEventListener('hashchange', () => render('route'));
    render('init');
  }
  return { init, render, listFor, MODES, newMemo, saveMemoText, flashSaved, COLORS, memos, memoTitle, setPanel, sections };
})();

</script>
<script>
/* ============================================================
 * 経理タスク管理 — 画面（ホーム／カレンダー／未完了一覧／付箋／設定）
 * ============================================================ */
const App = (() => {
  'use strict';
  const C = Core; const { $, $$, esc, ic, toast, openModal, closeModal, confirmDialog } = UI;
  const { Store, Sync, Local, KEY_DAILY, KEY_BEFORE_RESTORE } = Storage;
  const S = () => Store.state;
  const today = () => C.todayLocal();
  let lastToday = today();
  const ui = {
    calView: 'month', calMonth: today().slice(0, 7), calWeek: null, calSel: today(),
    listTab: 'open', pendingFilter: 'all', q: '', fStatus: 'open', fCat: '', fPri: '', fPeriod: 'all', fKind: '', sort: 'date-asc',
    holYear: Number(today().slice(0, 4)),
  };
  const PRI_ORDER = { high: 0, mid: 1, low: 2 };
  const cats = () => Object.values(S().categories).filter((c) => c && !c.deleted).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const catOf = (id) => (S().categories[id] && !S().categories[id].deleted ? S().categories[id] : { name: '未分類', color: '#8a97a8' });
  const tasks = () => Object.values(S().tasks).filter(C.alive);
  const commit = (...a) => Store.commit(...a);
  const isoDate = (ms) => { const d = new Date(ms); return C.ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const fmtSmart = (d) => (d && d.slice(0, 4) === today().slice(0, 4) ? C.fmtShort(d) : C.fmtJP(d));
  const sortTasks = (arr) => arr.sort((a, b) => (a.status === 'done') - (b.status === 'done') || a.executionDate.localeCompare(b.executionDate) || PRI_ORDER[a.priority] - PRI_ORDER[b.priority] || a.title.localeCompare(b.title, 'ja'));
  const taskState = (t, td = today()) => (t.status === 'done' ? 'done' : C.isOverdue(t, td) ? 'over' : 'open');

  /* ---------------- 部品 ---------------- */
  const catChip = (id) => { const c = catOf(id); return `<span class="chip"><i class="dot" style="background:${esc(c.color)}"></i>${esc(c.name)}</span>`; };
  const priBadge = (p) => `<span class="pri pri-${p || 'mid'}">${C.PRIORITY[p || 'mid']}</span>`;
  function dateMeta(t) {
    return t.scheduledDate && t.scheduledDate !== t.executionDate
      ? `<span class="shift" title="${esc(t.shiftReason || '休日')}のため変更">${C.fmtShort(t.scheduledDate)} → ${C.fmtShort(t.executionDate)}</span>` : `<span>${C.fmtShort(t.executionDate)}</span>`;
  }
  function lateBadge(t) {
    if (t.status === 'done') return '';
    const d = C.delayDays(t, today());
    if (d > 0) return `<span class="late">${d}日遅れ</span>`;
    if (C.refDate(t) === today()) return '<span class="late late-soft">今日期限</span>';
    return '';
  }
  function taskRow(t, { showDate = true } = {}) {
    const c = catOf(t.categoryId);
    return `<li class="trow ${t.status === 'done' ? 'done' : ''}" data-task="${esc(t.id)}">
      <i class="cbar" style="background:${esc(c.color)}"></i>
      <button type="button" class="check" data-toggle="${esc(t.id)}" aria-label="${esc(t.title)}を${t.status === 'done' ? '未完了に戻す' : '完了にする'}">${ic('check')}</button>
      <div class="tmain"><div class="ttitle">${t.priority === 'high' ? '<i class="hi-mark">!</i>' : ''}${esc(t.title)}</div>
        <div class="tmeta">${showDate ? dateMeta(t) : ''}${t.dueDate && t.dueDate !== t.executionDate ? `<span>期限 ${C.fmtShort(t.dueDate)}</span>` : ''}${catChip(t.categoryId)}${priBadge(t.priority)}${t.templateId ? `<span class="muted" title="繰り返し">${ic('repeat', 'i13')}</span>` : ''}${t.status === 'done' && t.completedAt ? `<span class="muted">完了 ${C.fmtShort(isoDate(t.completedAt))}</span>` : ''}</div>
        ${t.memo ? `<div class="tmemo">${esc(t.memo)}</div>` : ''}
      </div><div class="tside">${lateBadge(t)}</div></li>`;
  }
  const emptyBox = (msg, icon = 'inbox') => `<div class="empty">${ic(icon)}${esc(msg)}</div>`;

  /* ================= ホーム ================= */
  function viewHome() {
    const td = today(); const st = C.stats(S(), td); const reason = C.closedReason(td, S().settings);
    const remainWeek = st.week.filter((t) => t.executionDate > td);
    const monthOpen = sortTasks(st.month.filter((t) => t.status !== 'done'));
    const overdue = tasks().filter((t) => C.isOverdue(t, td));
    const hasTpl = Object.values(S().templates).some((t) => t && !t.deleted);
    const nextBiz = C.shiftDate(C.addDays(td, 1), 'next', S().settings);
    return `
      <div class="card hero"><div><div class="big">${C.fmtJP(td)}</div><div class="sub">${reason ? `今日は休日（${esc(reason)}）・次の営業日は ${C.fmtShort(nextBiz)}` : '今日は営業日です'}</div></div>
        <span class="tag">今日のタスク ${st.today.filter((t) => t.status !== 'done').length}件</span></div>
      ${!hasTpl ? `<div class="card section"><div class="card-b"><b style="color:var(--navy)">はじめに：毎月の業務を登録しましょう</b><p class="sub small" style="margin:6px 0 12px">「＋タスク追加」でタスク名・日付・繰り返しを選ぶだけで登録できます。代表的な4件（10日 売上入金確認／15日 請求書確認／25日 給与関連確認／月末 月次締め）をまとめて登録することもできます。</p><div class="row"><button type="button" class="btn btn-primary" data-action="new-task">${ic('plus')}タスク追加</button><button type="button" class="btn" data-action="seed">例の4件を追加</button></div></div></div>` : ''}
      <div class="stats">
        <a class="card stat" href="#list" data-goto-tab="open"><div class="label">未完了タスク</div><div class="value">${st.openCount}<small>件</small></div></a>
        <a class="card stat ${st.overdueCount ? 'alert' : ''}" href="#list" data-goto-tab="open" data-pf="overdue"><div class="label">期限切れ</div><div class="value">${st.overdueCount}<small>件</small></div></a>
        <a class="card stat" href="#list" data-goto-tab="done"><div class="label">完了済み（今月）</div><div class="value">${st.doneMonthCount}<small>件</small></div><div class="small muted">累計 ${st.doneCount}件</div></a>
        <div class="card stat"><div class="label">今月の完了率</div><div class="value">${st.monthRate}<small>%</small></div><div class="bar"><i style="width:${st.monthRate}%"></i></div></div>
      </div>
      ${overdue.length ? `<div class="card section" style="border-color:#f3c5ce"><div class="card-h"><h2 style="color:var(--red)">期限切れ・遅れているタスク</h2><span class="count">${overdue.length}件</span><a class="right btn btn-sm" href="#list" data-goto-tab="open" data-pf="overdue">すべて表示</a></div><ul class="tlist">${sortTasks(overdue).slice(0, 5).map((t) => taskRow(t)).join('')}</ul></div>` : ''}
      <div class="grid grid-2">
        <div class="card"><div class="card-h"><h2>今日のタスク</h2><span class="count">${st.today.length}件</span><button type="button" class="right btn btn-sm btn-sky" data-action="new-task" data-date="${td}">${ic('plus')}追加</button></div>
          ${st.today.length ? `<ul class="tlist">${sortTasks([...st.today]).map((t) => taskRow(t, { showDate: false })).join('')}</ul>` : emptyBox(reason ? '今日は休日です。予定されたタスクはありません' : '今日のタスクはありません', 'check')}</div>
        <div class="card"><div class="card-h"><h2>今週の残りのタスク</h2><span class="count">${C.fmtShort(st.weekStart)}〜${C.fmtShort(st.weekEnd)}</span></div>
          ${remainWeek.length ? `<ul class="tlist">${sortTasks(remainWeek).map((t) => taskRow(t)).join('')}</ul>` : emptyBox('今週の残りのタスクはありません')}</div>
      </div>
      <div class="card section" style="margin-top:16px"><div class="card-h"><h2>今月の未完了タスク</h2><span class="count">${monthOpen.length}件 / 全${st.month.length}件</span><a class="right btn btn-sm" href="#calendar">カレンダー</a></div>
        ${monthOpen.length ? `<ul class="tlist">${monthOpen.map((t) => taskRow(t)).join('')}</ul>` : emptyBox(st.month.length ? '今月のタスクはすべて完了しています' : '今月のタスクはまだありません', 'check')}</div>`;
  }

  /* ================= カレンダー ================= */
  function byDateMap() { const m = {}; for (const t of tasks()) (m[t.executionDate] = m[t.executionDate] || []).push(t); for (const k in m) sortTasks(m[k]); return m; }
  function dayClass(d) {
    const w = C.dow(d); const hn = C.holidayName(d); const cust = !hn && w !== 0 && w !== 6 ? C.closedReason(d, S().settings) : null;
    return { w, hn, cust, cls: [w === 0 ? 'sun' : w === 6 ? 'sat' : '', hn || cust ? 'hol' : ''].join(' ') };
  }
  function calItem(t, td) {
    const st = taskState(t, td);
    return `<span class="ci ci-${st} ${t.priority === 'high' ? 'hi' : ''}" role="button" tabindex="0" data-open-task="${esc(t.id)}" title="${esc(t.title)}${st === 'over' ? '（期限超過）' : st === 'done' ? '（完了）' : ''}">${t.priority === 'high' && st !== 'done' ? '<i class="hi-mark">!</i>' : ''}${esc(t.title)}</span>`;
  }
  function viewCalendar() {
    const td = today(); const map = byDateMap(); const desk = UI.isDesktop();
    let head, grid;
    if (ui.calView === 'week') {
      const ws = ui.calWeek || C.addDays(ui.calSel, -C.dow(ui.calSel)); ui.calWeek = ws; const we = C.addDays(ws, 6);
      const ps = C.parse(ws), pe = C.parse(we);
      head = `${ps.y}年${ps.m}月${ps.d}日〜${pe.m !== ps.m ? pe.m + '月' : ''}${pe.d}日`;
      let cols = '';
      for (let i = 0; i < 7; i++) {
        const d = C.addDays(ws, i); const { hn, cust, cls } = dayClass(d); const list = map[d] || [];
        cols += `<div class="wk-day ${d === td ? 'today' : ''} ${d === ui.calSel ? 'sel' : ''} ${hn || cust ? 'off' : ''}" data-day="${d}" tabindex="0" role="button" aria-label="${C.fmtJP(d)} ${list.length}件">
          <div class="wk-h ${cls}"><span class="n">${C.parse(d).d}</span><span class="w">${C.WD[C.dow(d)]}</span>${hn || cust ? `<span class="hname">${esc(hn || cust)}</span>` : ''}${desk ? `<button type="button" class="cell-add" data-action="new-task" data-date="${d}" aria-label="${C.fmtShort(d)}にタスク追加">${ic('plus')}</button>` : ''}</div>
          <div class="wk-list">${list.length ? list.map((t) => desk ? calItem(t, td) : `<ul class="tlist">${taskRow(t, { showDate: false })}</ul>`).join('') : '<span class="wk-empty">—</span>'}</div></div>`;
      }
      grid = `<div class="wk-grid">${cols}</div>`;
    } else {
      const [y, m] = ui.calMonth.split('-').map(Number); head = `${y}年${m}月`;
      const first = C.ymd(y, m, 1); const start = C.addDays(first, -C.dow(first));
      const weeks = Math.ceil((C.dow(first) + C.lastDay(y, m)) / 7); const max = desk ? 4 : 3;
      let cells = '';
      for (let i = 0; i < weeks * 7; i++) {
        const d = C.addDays(start, i); const { hn, cust, cls } = dayClass(d); const list = map[d] || [];
        const show = list.length > max ? list.slice(0, max - 1) : list;
        cells += `<div class="cal-cell ${d.slice(0, 7) !== ui.calMonth ? 'other' : ''} ${d === td ? 'today' : ''} ${d === ui.calSel ? 'sel' : ''} ${hn || cust ? 'off' : ''}" data-day="${d}" tabindex="0" role="button" aria-label="${C.fmtJP(d)}${hn ? ' ' + hn : ''} タスク${list.length}件">
          <div class="dnum ${cls}"><span class="n">${C.parse(d).d}</span>${hn || cust ? `<span class="hname">${esc(hn || cust)}</span>` : ''}${desk ? `<button type="button" class="cell-add" data-action="new-task" data-date="${d}" aria-label="${C.fmtShort(d)}にタスク追加" tabindex="-1">${ic('plus')}</button>` : ''}</div>

  /** スマホ：日付をタップしたらその日のタスク一覧をシートで表示 */
